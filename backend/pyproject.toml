[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "occupational-health"
version = "0.1.0"
description = "Offline occupational-health PDF knowledge base"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.4,<6",
  "redis>=5.2,<8",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "qdrant-client>=1.15,<2",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.32,<1",
  "pyyaml>=6.0,<7",
  "mcp>=1.9,<2",
]

[project.optional-dependencies]
pipeline = [
  "rapidocr-onnxruntime>=1.4,<2",
  "onnxruntime>=1.19,<2",
  "sentence-transformers>=3,<6",
]
eval = [
  "ragas>=0.2,<1",
  "datasets>=3,<4",
  "pandas>=2,<3",
  "openai>=1,<2",
  "langchain-openai>=0.2,<1",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "locust>=2.32,<3",
  "ruff>=0.8,<1",
  "black>=24.10,<27",
  "mypy>=1.13,<2",
]

[project.scripts]
oh-api = "occupational_health.api.main:run"
oh-api-client = "occupational_health.services.api_clients.cli:main"
oh-demo = "occupational_health.demo:run_demo"
oh-mcp = "occupational_health.mcp.server:main"
oh-eval = "occupational_health.eval.run_eval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/occupational_health"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "integration: requires running infrastructure",
  "slow: long-running model or performance validation",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "var", "models", "tests/fixtures/private"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106", "S107"]
"src/occupational_health/api/routes/**" = ["B008"]
"src/occupational_health/demo.py" = ["S106"]
"deploy/scripts/**" = ["S603", "S607"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
packages = ["occupational_health"]
