# Cloudflare Tunnel —— 只把 MCP 端点暴露到公网
#
# 复制为 config.yml 后填写自己的隧道信息。
# config.yml 已被 .gitignore 忽略，不要提交真实 UUID 或凭证路径。
#
# 一次性准备：
#   cloudflared tunnel login
#   cloudflared tunnel create oh-kb
#   cloudflared tunnel route dns oh-kb kb.example.com
#
# 把下面 3 处占位符换成实际值：
#   REPLACE_WITH_TUNNEL_ID
#   kb.example.com
#   C:\Users\<你的用户名>\.cloudflared\<TUNNEL_ID>.json
#
# 启动：
#   cloudflared tunnel --config deploy\cloudflared\config.yml run

tunnel: REPLACE_WITH_TUNNEL_ID
credentials-file: C:\Users\<你的用户名>\.cloudflared\REPLACE_WITH_TUNNEL_ID.json

ingress:
  - hostname: kb.example.com
    path: ^/mcp(/.*)?$
    service: http://127.0.0.1:8000
  - service: http_status:404
